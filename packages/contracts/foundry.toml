[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"   # Verified safe on BSC (56/97) and opBNB (204/5611); raise only after confirming target chain support
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
opbnb_testnet = "${OPBNB_TESTNET_RPC_URL}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97, url = "https://api-testnet.bscscan.com/api" }
opbnb_testnet = { key = "${OPBNBSCAN_API_KEY}", chain = 5611, url = "https://open-platform.nodereal.io/${OPBNBSCAN_API_KEY}/op-bnb-testnet/contract/" }
