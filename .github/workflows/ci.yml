name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install OpenZeppelin & forge-std if missing
        run: |
          [ -d lib/forge-std ] || forge install foundry-rs/forge-std --no-commit
          [ -d lib/openzeppelin-contracts ] || forge install OpenZeppelin/openzeppelin-contracts@v5.2.0 --no-commit
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge coverage --report summary

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Ensure Foundry libs installed
        working-directory: packages/contracts
        run: |
          [ -d lib/forge-std ] || forge install foundry-rs/forge-std --no-commit
          [ -d lib/openzeppelin-contracts ] || forge install OpenZeppelin/openzeppelin-contracts@v5.2.0 --no-commit
      - uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm -r test

  claude-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this PR as the security-auditor agent would. Focus on contracts and key handling."
